name: PR Preview

on:
  pull_request:
    types: [ opened, synchronize, reopened, closed ]

permissions:
  contents: read
  pull-requests: write

jobs:
  # 为每个 PR 部署独立预览，并在 PR 上更新预览地址
  preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: 部署预览
        id: deploy
        run: |
          # TODO: 替换为你的预览托管（Vercel / Netlify / 自建）
          echo "url=https://pr-${{ github.event.number }}.preview.example.com" >> $GITHUB_OUTPUT

      - name: 在 PR 上评论预览地址
        uses: actions/github-script@v7
        with:
          script: |
            const body = `预览环境已就绪：${{ steps.deploy.outputs.url }}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const mine = comments.find(c => c.body.includes('预览环境已就绪'));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  # PR 关闭时清理预览资源
  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: 销毁预览环境
        run: |
          echo "TODO: 销毁 pr-${{ github.event.number }} 的预览资源"
