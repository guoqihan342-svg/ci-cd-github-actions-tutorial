name: Deploy API

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # 推送镜像到 GHCR

# 部署串行化：不取消进行中的运行，避免留下不一致状态
concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像地址
        id: meta
        run: |
          # GHCR 要求镜像路径全小写，${VAR,,} 将变量转为小写
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production        # 需在 Settings → Environments 配置审批人
    steps:
      - name: 部署到服务器
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /opt/my-api
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            # 迁移必须在启动新容器之前执行
            docker compose run --rm api npx prisma migrate deploy
            docker compose up -d
            docker image prune -f

# 需要在仓库 Settings → Secrets 中配置：
#   SSH_HOST / SSH_USER / SSH_KEY   服务器 SSH 连接信息
#   GHCR_TOKEN                      拉取私有镜像用的令牌
