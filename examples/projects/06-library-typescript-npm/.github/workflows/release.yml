name: Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write        # 打 tag、创建 Release
  pull-requests: write   # 创建 / 更新 Version Packages PR
  id-token: write        # npm provenance 需要

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # Changesets 需要完整 git 历史

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: changesets/action@v1
        with:
          publish: npm run release -- --provenance
          title: "chore: release"
          commit: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

# 需要在仓库 Settings → Secrets 中配置：
#   NPM_TOKEN   npm Automation / Granular Access Token（需开启 2FA）
